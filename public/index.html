<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チャットサイト</title>

<style>
body{
    font-family:sans-serif;
    max-width:800px;
    margin:auto;
    padding:20px;
}

#messages{
    border:1px solid #ccc;
    height:400px;
    overflow-y:auto;
    padding:10px;
    margin-bottom:10px;
}

.message{
    margin:5px 0;
    padding:5px;
    background:#f2f2f2;
    border-radius:5px;
}

input{
    padding:10px;
}

#name{
    width:20%;
}

#message{
    width:55%;
}

button{
    padding:10px;
}
</style>
</head>
<body>

<h1>チャットサイト</h1>

<div id="messages"></div>

<input id="name" placeholder="名前">
<input id="message" placeholder="メッセージ">
<button onclick="sendMessage()">送信</button>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();
const messages = document.getElementById("messages");

socket.on("chat history", (history) => {
    history.forEach(msg => {
        addMessage(msg);
    });
});

socket.on("chat message", (msg) => {
    addMessage(msg);
});

function addMessage(msg) {

    const div = document.createElement("div");
    div.className = "message";

    const text = String(msg);

    // data:image/... の場合
    if (text.includes("data:image/")) {

        const start = text.indexOf("data:image/");
        const sender = text.substring(0, start).trim();

        if (sender) {
            const label = document.createElement("div");
            label.textContent = sender;
            div.appendChild(label);
        }

        const img = document.createElement("img");
        img.src = text.substring(start);

        img.style.maxWidth = "300px";
        img.style.maxHeight = "300px";

        div.appendChild(img);
    }

    // http:// や https:// の場合
    else if (text.includes("http://") || text.includes("https://")) {

        const match = text.match(/https?:\/\/\S+/);

        if (match) {

            const url = match[0];
            const sender = text.substring(0, text.indexOf(url)).trim();

            const img = document.createElement("img");
            img.src = url;

            img.style.maxWidth = "300px";
            img.style.maxHeight = "300px";

            img.onerror = () => {
                div.textContent = text;
            };

            if (sender) {
                const label = document.createElement("div");
                label.textContent = sender;
                div.appendChild(label);
            }

            div.appendChild(img);

        } else {

            div.textContent = text;

        }
    }

    // 普通のメッセージ
    else {

        div.textContent = text;

    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}
    
function sendMessage(){

    const name =
        document.getElementById("name").value.trim();

    const message =
        document.getElementById("message").value;

    if(!message) return;

    socket.emit("change name", name, (success, reason) => {

        if (!success) {
            alert(reason);
            return;
        }

const now = new Date();

const time =
    String(now.getHours()).padStart(2, "0") +
    ":" +
    String(now.getMinutes()).padStart(2, "0");

socket.emit(
    "chat message",
    `[${time}] ${name}: ${message}`
);

        document.getElementById("message").value = "";
    });
}
</script>

</body>
</html>
